tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Get all contacts with optional filtering and pagination
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Page number for pagination
    schema:
      type: integer
    example: 1
  - name: perPage
    in: query
    description: Number of items per page
    schema:
      type: integer
    example: 10
  - name: sortBy
    in: query
    description: Field by which to sort the results
    schema:
      type: string
      enum: [name, email, phoneNumber]
    example: name
  - name: sortOrder
    in: query
    description: Sort order (ascending or descending)
    schema:
      type: string
      enum: [asc, desc]
    example: asc
  - name: type
    in: query
    description: Filter by contact type
    schema:
      type: string
      enum: [work, home, personal]
    example: home
  - name: isFavourite
    in: query
    description: Filter by favorite status
    schema:
      type: boolean
    example: true
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 1
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 100
                totalPages:
                  type: number
                  example: 10
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml