tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: Update contact fields by ID
security: 
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to update
    schema:
      type: string
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: Contact name
            type: string
            example: Maxym Pysko
          phoneNumber:
            description: Contact phone number
            type: string
            example: 380682784512
          contactType:
            description: Contact type
            type: string
            enum: ['work', 'home', 'personal']
            example: work
          photo:
            description: New contact photo
            type: string
            format: binary
responses: 
  '200':
    description: Successfully patched a contact!
    content: 
      application/json:
        schema: 
          type: object
          required: 
            - status
            - message
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
