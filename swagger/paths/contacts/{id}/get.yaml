tags: 
  -  Contacts
summary: Get contact by id
operationId:  getStudent
description: Get contact by id
security: 
  -  bearerAuth: []
parameters: 
  - in: path
    name: id
    required: true
    schema: 
      type: string
      example: 67f8dc2bcb2959b8f1e5200b
responses: 
  '200':
    description: Get contact by id
    content: 
      application/json:
        schema: 
          type: object
          required: 
            - status
            - message
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 
            data:
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content: 
      application/json:
        schema:
          type: object 
          required: 
            -  status
            - message
          properties: 
            status: 
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
