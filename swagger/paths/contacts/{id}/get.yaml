summary: Get contact by id
operationId:  getStudent
description: Get contact by id
parameters: 
  - in: path
    name: id
    required: true
    schema: 
      type: string
      example: 67f8dc2bcb2959b8f1e5200b
responses: 
  '200':
    description: Get contact by id
    content: 
      application/json:
        schema: 
          type: object
          required: 
            - status
            - message
            - data
          properties: 
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 
            data:
              type: object
