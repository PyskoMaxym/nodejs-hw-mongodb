tags:
  - Contacts
summary: Delete contact
operationId: deleteContact
description: Delete contact by ID
security: 
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    description: ID of the contact to delete
    schema:
      type: string
responses: 
  '204':
    description: Contact successfully deleted
    content: 
      application/json:
        schema: 
          type: object
          required: 
            - status
          properties: 
            status:
              type: integer
              example: 204
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  '500':
    $ref: ../../../components/responses/500.yaml
